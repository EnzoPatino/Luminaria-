services:
  # ─────────────────────────────────────────────────────────
  # 1. Base de datos PostgreSQL
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: luminaria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luminaria}
      POSTGRES_USER: ${POSTGRES_USER:-luminaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luminaria_dev}
    ports:
      - "5432:5432"
    volumes:
      - luminaria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luminaria} -d ${POSTGRES_DB:-luminaria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────
  # 2. Broker MQTT (Eclipse Mosquitto)
  # ─────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: luminaria_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT TCP para gateways / microcontroladores
      - "9001:9001" # WebSockets interno/directo
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/passwords:/mosquitto/config/passwords:ro
      - ./deploy/mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - luminaria_mqttdata:/mosquitto/data
      - luminaria_mqttlog:/mosquitto/log

  # ─────────────────────────────────────────────────────────
  # 3. Backend API (Node.js + Express)
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminaria_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: "*"
      TRUST_PROXY: "true"
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-luminaria}
      PGUSER: ${POSTGRES_USER:-luminaria}
      PGPASSWORD: ${POSTGRES_PASSWORD:-luminaria_dev}
      MQTT_SUBSCRIBER_ENABLED: "false"
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 300
    expose:
      - "3000"

  # ─────────────────────────────────────────────────────────
  # 4. Servidor Web & Reverse Proxy (Nginx)
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: luminaria_web
    restart: unless-stopped
    depends_on:
      - backend
      - mosquitto
    ports:
      - "80:80"
    volumes:
      # Monta la raiz del frontend directamente en Nginx
      - .:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro

volumes:
  luminaria_pgdata:
  luminaria_mqttdata:
  luminaria_mqttlog:
