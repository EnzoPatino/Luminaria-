# Seccion: persistencia y logs del broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Seccion: autenticacion y control de acceso.
allow_anonymous true
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/aclfile
allow_zero_length_clientid false
message_size_limit 1048576
max_packet_size 1048576
max_keepalive 120

# Seccion: MQTT TCP para ESP32/gateways y worker backend.
listener 1883 0.0.0.0
protocol mqtt
max_connections 1000

# Seccion: WebSockets para UI; accesible dentro de la red Docker en el puerto 9001
listener 9001 0.0.0.0
protocol websockets
max_connections 300
