worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  # Seccion: normalizacion de upgrade para WebSockets MQTT.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Seccion: upstreams internos de API y Mosquitto WebSockets.
  upstream luminaria_api {
    server 127.0.0.1:3000;
    keepalive 32;
  }

  upstream luminaria_mqtt_ws {
    server 127.0.0.1:9001;
    keepalive 16;
  }

  # Seccion: hardening de TLS y rate limit perimetral.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  server {
    listen 80;
    listen [::]:80;
    server_name luminaria.example.com;

    # Seccion: challenge de Let's Encrypt antes de redirigir a HTTPS.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name luminaria.example.com;

    # Seccion: certificados emitidos por Certbot/Let's Encrypt.
    ssl_certificate /etc/letsencrypt/live/luminaria.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luminaria.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Seccion: cabeceras defensivas para la aplicacion web.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    root /var/www/luminaria;
    index index.html;

    # Seccion: frontend estatico vanilla.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Seccion: proxy reverso para API REST.
    location /api/ {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://luminaria_api/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # Seccion: proxy WebSocket para MQTT sobre WSS.
    location /mqtt {
      proxy_pass http://luminaria_mqtt_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
