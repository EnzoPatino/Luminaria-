worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  # Normalizacion de upgrade para WebSockets MQTT
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Upstreams en la red interna de Docker
  upstream backend_api {
    server backend:3000;
    keepalive 32;
  }

  upstream mosquitto_ws {
    server mosquitto:9001;
    keepalive 16;
  }

  # Rate limiting perimetral para API
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

  server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend estatico
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para API REST
    location /api/ {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://backend_api/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # Proxy WebSocket para MQTT sobre /mqtt
    location /mqtt {
      proxy_pass http://mosquitto_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Challenge opcional de Let's Encrypt (para cuando configuren SSL)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
  }
}
